<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8" role="presentation">
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect y="3" width="1000" height="2" rx="1" fill="url(#dv)" opacity="0.35"/>
  <rect y="2" width="140" height="4" rx="2" fill="#2dd4bf">
    <animate attributeName="x" values="-140;1000" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
